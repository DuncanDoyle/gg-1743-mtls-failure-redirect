# Only allows requests on the "https" listener that presented a valid client certificate; everything else gets a 403.
# Thanks to AllowInsecureFallback on the Gateway, these requests reach the HTTP layer instead of failing the handshake.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: require-valid-client-cert
  namespace: ingress-gw
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw
      sectionName: https # <-- Attached to the listener, so it covers every route on it.
  rbac:
    # <-- Allow, not Deny: if the attribute is missing (Envoy < 1.39), nothing matches and the request is denied.
    action: Allow
    policy:
      matchExpressions:
        # <-- True only when a cert was sent and passed validation.
        - "connection.peer_certificate_valid"
