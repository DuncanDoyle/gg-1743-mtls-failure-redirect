apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: diary-example-com
  namespace: diary
spec:
  parentRefs:
    - name: gw
      namespace: ingress-gw
      sectionName: http # <-- Plain HTTP listener without client cert checks, so the redirect can't loop.
  hostnames:
    - "diary.example.com"
  rules:
    - backendRefs:
        - name: diary
          port: 8080
